# NOTE: you can use vars with $<var> and ${<var>} as long as the str is double quoted: ""
# WARNING: hex colors can't contain capital letters

# --> Catppuccin
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_gray="#bac2de"
thm_cyan="#9399b2"
thm_magenta="#9399b2"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black="#181825"
thm_black4="#11111b"

# ----------------------------=== Theme ===--------------------------

# status
set -g status-interval 1
set -g escape-time 10
set -g focus-events on
set -g status "on"
set -g status-bg "${thm_black}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# messages
set -g message-style fg="${thm_cyan}",bg="${thm_black}",align="centre"
set -g message-command-style fg="${thm_cyan}",bg="${thm_black}",align="centre"

# panes
set pane-border-status
set -g pane-border-style fg="${thm_black}"
set -g pane-active-border-style fg="${thm_blue}"

# windows
setw -g window-status-activity-style fg="${thm_fg}",bg="${thm_bg}",none
setw -g window-status-separator ""
setw -g window-status-style fg="${thm_fg}",bg="${thm_bg}",none

# statusline - changed to show pane number followed by pane name on left
set -g status-left ""
set -g status-right "#[fg=$thm_pink,bg=$thm_black,nobold,nounderscore,noitalics] #[fg=$thm_bg,bg=$thm_pink,nobold,nounderscore,noitalics] #{b:pane_current_path} #{?client_prefix,#[fg=$thm_red],#[fg=$thm_green]}#[bg=$thm_black] #{?client_prefix,#[bg=$thm_red],#[bg=$thm_green]}#[fg=$thm_bg]  #[fg=$thm_fg,bg=$thm_black] #S"

# window status format - removed current dir from here
setw -g window-status-format "#[fg=$thm_bg,bg=$thm_blue] #I #[fg=$thm_gray,bg=$thm_black] #W "
setw -g window-status-current-format "#[fg=$thm_bg,bg=$thm_orange] #I #[fg=$thm_fg,bold,bg=$thm_bg] #W "

# modes
setw -g clock-mode-colour "${thm_blue}"
setw -g mode-style "fg=${thm_pink} bg=${thm_black4} bold"

# -----------------------------------------------------------------------------
# terminal colors
set -g default-terminal "screen-256color" 
set-option -sa terminal-overrides ",xterm-256color:RGB"


# switch windows
bind -r n next-window
bind -r p previous-window

# switch pane
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# split pane
bind v split-window -h
bind s split-window -v

# kill pane
bind q killp

# enable mouse mode (tmux 2.1 and above)
set -g mouse on

#set-option -sa terminal-features ',kitty:RGB'
# set -g default-terminal "tmux-256color" 
# set-option -sa terminal-overrides ",xterm-256color:RGB"
# reload config file
bind-key r source-file ~/.tmux/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# start at 1
set -g base-index 1
setw -g pane-base-index 1

# do not rename panes
set-option -g allow-rename off
