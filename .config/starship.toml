format = """
[](#F6BBE7)\
$username\
[](fg:#F6BBE7 bg:#708190)\
$directory\
[](fg:#708190 bg:#3d4059)\
$git_branch\
$git_status\
$time\
[ ](fg:#3d4059)\
\n$character
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#F6BBE7 fg:#313449"
style_root = "bg:#F6BBE7 fg:#C34864"
format = '[$user ]($style)'
disabled = false

[directory]
style = "fg:#e1e1ec bg:#708190"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[docker_context]
show_always = false 
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#EBB9B9 fg:#2c2e3e"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#EBB9B9 fg:#2c2e3e"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8 fg:#3d4059"
